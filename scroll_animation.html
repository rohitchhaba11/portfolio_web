<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Based Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 1000vh; /* Gives plenty of room to scroll through 240 frames */
            background-color: #000;
        }

        #scroll-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: -1;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Change to contain if you want to see the whole image */
        }
    </style>
</head>
<body>

    <div id="scroll-container">
        <canvas id="animation-canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('animation-canvas');
        const ctx = canvas.getContext('2d');
        
        // Ensure crisp rendering on high DPI displays
        const setupCanvas = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        };

        const frameCount = 240;
        // Pad the index with leading zeros to match frame_000000.png format
        const getFramePath = index => `frames_png/frame_${index.toString().padStart(6, '0')}.png`;

        // Preload images to prevent flickering during scroll
        const images = [];

        for (let i = 0; i < frameCount; i++) {
            const img = new Image();
            img.src = getFramePath(i);
            images.push(img);
            
            // Draw the first frame as soon as it loads
            if (i === 0) {
                img.onload = () => {
                    setupCanvas();
                };
            }
        }

        let currentFrameIndex = 0;
        let ticking = false;

        const drawImage = (img) => {
            if (!img || !img.complete) return;

            // Draw image to cover the canvas (similar to background-size: cover)
            const canvasRatio = canvas.width / canvas.height;
            const imgRatio = img.width / img.height;
            
            let drawWidth = canvas.width;
            let drawHeight = canvas.height;
            let offsetX = 0;
            let offsetY = 0;

            if (canvasRatio > imgRatio) {
                drawHeight = canvas.width / imgRatio;
                offsetY = (canvas.height - drawHeight) / 2;
            } else {
                drawWidth = canvas.height * imgRatio;
                offsetX = (canvas.width - drawWidth) / 2;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // using image smoothing for better quality
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
        };

        const render = () => {
            drawImage(images[currentFrameIndex]);
        };

        // Re-calculate size and render on resize
        window.addEventListener('resize', setupCanvas);

        // Map scroll position to frame index
        window.addEventListener('scroll', () => {
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
            const scrollFraction = scrollTop / maxScrollTop;
            
            // Calculate which frame we should be on
            const frameIndex = Math.min(
                frameCount - 1,
                Math.max(0, Math.floor(scrollFraction * frameCount))
            );

            if (currentFrameIndex !== frameIndex) {
                currentFrameIndex = frameIndex;
                
                // Use requestAnimationFrame for smooth, lossless rendering performance
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        render();
                        ticking = false;
                    });
                    ticking = true;
                }
            }
        }, { passive: true }); // passive: true improves scroll performance

    </script>
</body>
</html>
